<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/inicio_sesion.css') }}">
</head>

<body>

    <div class="login-container">

        <h1>Iniciar Sesión</h1>

        <p>Ingresa tus datos para continuar</p>

        <form action="{{ url_for('controlador_login.login') }}" method="POST">

            <div class="input-group">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingresa tu usuario"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

            </div>


            <button type="submit" class="btn-login">
                Iniciar Sesión
            </button>

        </form>


        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}


        <div class="footer">
            Sistema de gestión
        </div>

    </div>

</body>

</html>
